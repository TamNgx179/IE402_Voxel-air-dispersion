<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>A3.6 Web Spike - Voxel Air Dispersion</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div id="map"></div>

  <section class="panel">
    <h1>A3.6 · Web technology spike</h1>

    <p class="subtitle">
      MapLibre + deck.gl · mock grid 10×10 · Nguyễn Huệ, TP.HCM
    </p>

    <div class="row">
      <label for="height-slider">Độ cao hiển thị</label>
      <span id="height-value">1.5 m</span>
    </div>

    <input
      id="height-slider"
      type="range"
      min="0"
      max="2"
      step="1"
      value="0"
    />

    <div class="ticks">
      <span>1.5 m</span>
      <span>15 m</span>
      <span>30 m</span>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Cells</span>
        <span id="cell-count" class="stat-value">100</span>
      </div>

      <div class="stat">
        <span class="stat-label">Mean</span>
        <span id="mean-value" class="stat-value">--</span>
      </div>

      <div class="stat">
        <span class="stat-label">Max</span>
        <span id="max-value" class="stat-value">--</span>
      </div>
    </div>

    <div class="legend-title">
      Mock PM2.5 concentration (µg/m³)
    </div>

    <div class="legend"></div>

    <div class="legend-labels">
      <span>0</span>
      <span>25</span>
      <span>50</span>
      <span>75</span>
      <span>100+</span>
    </div>
  </section>

  <div id="status-box">
    A3.6: <span id="status">loading libraries...</span>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@^9.0.0/dist.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
