project:
  name: "IE402 Voxel Air Dispersion"


# ============================================================
# PATHS
# ============================================================

paths:
  buildings: "data/raw/buildings.geojson"

  study_area: "data/raw/study_area.geojson"

  roads: "data/raw/roads.geojson"

  # Scene-only layers (src/00_prepare_landcover.py); not model inputs.
  water: "data/raw/water.geojson"

  green: "data/raw/green.geojson"

  # Scene package seeded into PostGIS (src/07_export_scene.py). Committed,
  # so a clean machine can seed without Internet (docs/DATABASE.md §5).
  scene_package_dir: "db/seeds/scene"

  # A3.1
  road_class_summary: "output/analysis/road_class_summary.csv"

  # A3.2
  road_emissions: "data/processed/road_emissions.geojson"

  # A3.3 - dimensionless relative spatial allocation
  emission_source_netcdf: "data/processed/emission_source.nc"

  # A3.4 - EDGAR raw/cache files
  edgar_archive: "data/raw/edgar/v8.1_FT2022_AP_PM2.5_2022_TRO_flx_nc.zip"

  edgar_extract_dir: "data/raw/edgar/extracted"

  # A3.4 - final transport-ready source
  emission_source_transport_netcdf: "data/processed/emission_source_transport.nc"

  # A3.4 - auditable normalization factor/report
  edgar_normalization_report: "output/analysis/edgar_normalization.json"

  # A3.5 - generated record of every emission assumption (committed; never hand-edited)
  emission_assumptions: "docs/emission_assumptions.md"

  voxel_netcdf: "data/processed/voxel_grid.nc"

  processed_buildings: "data/processed/buildings_with_height.geojson"


# ============================================================
# COORDINATE REFERENCE SYSTEM
# ============================================================

crs:
  target: "auto_utm"

  buildings_if_missing: null

  study_area_if_missing: null


# ============================================================
# DOMAIN
# ============================================================

domain:

  horizontal:

    mode: "fixed_size_centered_on_study_area"

    width_m: 500.0

    height_m: 500.0

    padding_m: 0.0


  vertical:

    min_m: 0.0

    max_m: 100.0


# ============================================================
# VOXEL GRID
# ============================================================

grid:

  dx_m: 5.0

  dy_m: 5.0

  dz_m: 2.0


# ============================================================
# METEOROLOGY
# ============================================================

meteorology:

  source: "Open-Meteo Historical Forecast"

  analysis_period:

    start_date: "2025-01-01"

    end_date: "2025-12-31"


  direction_convention: "meteorological_from_deg_clockwise_from_north"


  scenarios:

    dry_nov_apr:

      direction_from_deg: 112.0

      speed_m_s: 1.62


    wet_may_oct:

      direction_from_deg: 227.0

      speed_m_s: 1.84


# ============================================================
# MASS-CONSISTENT DIAGNOSTIC WIND (B4)
# ============================================================

wind:
  poisson_method: "cg"
  profile_exponent: 0.25
  reference_height_m: 10.0
  alpha1: 1.0
  alpha2: 1.0
  omega: 1.78
  sor_tolerance: 0.0001
  divergence_tolerance_s_1: 0.001
  max_iter: 10000


# ============================================================
# TRAFFIC EMISSIONS
# ============================================================

emissions:

  # Spatial proxy pollutant from Tran et al.
  #
  # It remains labelled PM because the cited 0.053 value
  # must not silently be relabelled as PM2.5.
  pollutant: "PM"


  # ----------------------------------------------------------
  # A3.2 - MOTORCYCLE EMISSION FACTOR
  # ----------------------------------------------------------

  emission_factor:

    value_g_per_vehicle_km: 0.053

    source: "Tran et al. (2024), IOP Conference Series: Earth and Environmental Science 1391 012007"

    doi: "10.1088/1755-1315/1391/1/012007"


  # ----------------------------------------------------------
  # A3.2 - RELATIVE ROAD ALLOCATION
  # ----------------------------------------------------------

  allocation:

    basis: "osm_highway_class"

    # These are modelling assumptions, not traffic counts.
    #
    # Only relative ratios matter before EDGAR normalization.
    road_class_weights:

      primary: 1.00

      secondary: 0.75

      tertiary: 0.50

      residential: 0.25


  # ----------------------------------------------------------
  # A3.5 - PUBLISHED TRAFFIC FIGURES for the implied-flow check
  #
  # Context only: neither is a count on a road in this domain.
  # ----------------------------------------------------------

  flow_references:

    - figure: "Nút giao Hàng Xanh: cao điểm ~22.000 xe/h (tổng mọi hướng), 85–90 % xe máy"
      source: "Nguyen H.K. (2026), Mathematical Modelling of Engineering Problems 13(5):889-896"
      doi: "10.18280/mmep.130509"
      caveat: "tổng một nút giao lớn, số 'reported' từ Sở GTVT, không phải một đoạn đường; nút nằm ngoài miền mô hình"

    - figure: "Xe máy chiếm 80 % số xe đếm trên 70 tuyến phố TP.HCM (06:00-19:00, 2021)"
      source: "Ho et al. (2022), International Journal of Environmental Research and Public Health"
      doi: "10.3390/ijerph192316156"
      caveat: "tỉ lệ thành phần, không có lưu lượng theo từng tuyến"

  # ----------------------------------------------------------
  # A3.3 - ROAD -> VOXEL
  # ----------------------------------------------------------

  rasterization:

    source_height_m: 1.0

    geometry_length_relative_tolerance: 0.01

    output_dtype: "float32"

    netcdf_engine: "netcdf4"

    compression_level: 4


  # ----------------------------------------------------------
  # A3.4 - EDGAR ABSOLUTE NORMALIZATION
  # ----------------------------------------------------------

  normalization:

    method: "EDGAR_v8.1_annual_road_transport_flux_area_weighted"

    # Absolute pollutant represented by the transport-ready
    # field after this normalization.
    target_pollutant: "PM2.5"

    source_release: "EDGAR v8.1"

    # v8.1 air-pollutant data are available through 2022.
    source_year: 2022

    # EDGAR sector:
    # IPCC 1A3b - Road transportation.
    source_sector_code: "TRO"

    source_sector_description: "IPCC 1A3b - Road transportation"

    source_product: "annual_sector_specific_flux"

    # Year-specific PM2.5 road-transport flux archive.
    #
    # Kept in config rather than Python so changing EDGAR
    # release/year does not require source-code modification.
    archive_url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/EDGAR/datasets/v81_FT2022_AP_new/PM2.5/TRO/flx_nc/v8.1_FT2022_AP_PM2.5_2022_TRO_flx_nc.zip"

    download_if_missing: true

    download_timeout_s: 180.0

    # null:
    # require the downloaded annual ZIP to contain exactly
    # one NetCDF file.
    #
    # If EDGAR changes archive structure, explicitly set the
    # desired member here instead of guessing in Python.
    member_name: null

    variable_name: "fluxes"

    latitude_coordinate: "lat"

    longitude_coordinate: "lon"

    expected_units: "kg m-2 s-1"

    # Maximum allowed relative discrepancy between:
    #
    # model domain area
    #
    # and
    #
    # sum of EDGAR-cell/model-domain intersection areas.
    area_coverage_relative_tolerance: 0.000001

    output_dtype: "float32"

    netcdf_engine: "netcdf4"

    compression_level: 4

    attribution: "European Commission, Joint Research Centre (JRC), EDGAR v8.1 Global Air Pollutant Emissions"


# ============================================================
# TRANSPORT (src/03_transport.py) - contract v1, docs/spec.md D3
# ============================================================

transport:

  # B5: same explicit face-flux FV operator, preassembled as a sparse matrix.
  implementation: "sparse"
  stopping_criterion: "steady_state"
  steady_state:
    interval_s: 30.0
    minimum_s: 600.0
    tolerance: 0.001
    required_checks: 3

  max_simulated_s: 1800.0

  # Upwind is stable at Courant <= 1; 0.5 keeps a margin (spec BR-7).
  courant_target: 0.5

  # Explicit modelling assumptions, kept out of source code. B5 sensitivity
  # must vary these before final scientific claims are made.
  horizontal_diffusivity_m2_s: 2.0
  vertical_diffusivity_m2_s: 1.0
  mass_balance_tolerance: 0.000001
  positivity_correction_tolerance: 0.000000001


# ============================================================
# VOXELIZATION
# ============================================================

voxelization:

  clip_to_study_area: true


  # ----------------------------------------------------------
  # BUILDING HEIGHT
  # ----------------------------------------------------------

  height:

    direct_fields:

      - "height"


    levels_fields:

      - "building:levels"


    meters_per_level: 3.0


    minimum_height_m: 0.0


    maximum_height_m: null


    fallback:

      mode: "error"

      height_m: null


  # ----------------------------------------------------------
  # BUILDING RASTERIZATION
  # ----------------------------------------------------------

  rasterization:

    all_touched: false

    overlap_rule: "maximum_height"


  # ----------------------------------------------------------
  # OUTPUT
  # ----------------------------------------------------------

  output:

    save_processed_buildings: true

    processed_buildings_crs: "EPSG:4326"

    netcdf_engine: "netcdf4"

    compression_level: 4

    height_dtype: "float32"

    mask_dtype: "uint8"


# ============================================================
# RUNTIME
# ============================================================

runtime:

  log_level: "INFO"


# ============================================================
# NETCDF METADATA
# ============================================================

metadata:

  title: "3D voxel representation of urban buildings"

  project: "IE402 Voxel Air Dispersion"

  conventions: "CF-1.10"

  coordinate_order: "z,y,x"

  description: "Rasterized building-height field and three-dimensional building occupancy mask"

# ============================================================
# TIER 3 - SPATIAL ANALYSIS (src/04_analysis.py, src/analysis/)
# ============================================================

analysis:

  # Data contract with the model: one file per scenario,
  # variable C [z,y,x] in ug m-3 (see src/analysis/fields.py).
  concentration_pattern: "output/netcdf/concentration_{scenario}.nc"

  report_pattern: "output/analysis/analysis_{scenario}.json"

  # Horizontal slices: breathing height, 2nd floor, 15 m, 30 m
  # (docs/RESEARCH.md §13.3, item 1).
  slice_heights_m: [1.5, 6.0, 15.0, 30.0]

  # Building floor height for facade exposure, same as
  # voxelization.height.meters_per_level.
  floor_height_m: 3.0

  # PM2.5, ug m-3. QCVN 05:2023/BTNMT Table 1: 24 h = 50, and 45
  # from 01/01/2026 (footnote *); annual = 25. WHO 2021 AQG:
  # 24 h = 15, annual = 5. Read from the official PDF on 06/10/2026:
  # docs/RESEARCH.md §1.3. This is the only copy of these numbers.
  thresholds_ug_m3:

    qcvn_24h:
      value: 45.0
      label: "QCVN 05:2023 · 24 h (từ 01/01/2026)"

    who_24h:
      value: 15.0
      label: "WHO 2021 · 24 h"

  # Gaussian baseline on the REAL road source (A3.4 output) and the
  # two meteorology scenarios. Plumes ignore buildings by design.
  gaussian_baseline:

    source_netcdf: "data/processed/emission_source_transport.nc"

    stability: "D"

    reference_height_m: 10.0

    scenarios: ["dry_nov_apr", "wet_may_oct"]


# ============================================================
# WEB EXPORT (src/06_export_web.py) AND VIEWER (web/)
# ============================================================

web:

  output_dir: "web/data"

  # Every file is a <script> assigning a global, so the viewer also
  # opens from file:// where fetch() of local JSON is refused.
  size_budget_bytes: 5000000

  # uint8 log scale: 0 = building / no data, 1 = below range,
  # 2..255 = log10(C) over [max / 10^decades, max].
  log_decades: 4.0

  # Scenario ids to export; each needs concentration_{id}.nc.
  scenarios:
    - "dry_nov_apr_gaussian"
    - "wet_may_oct_gaussian"
