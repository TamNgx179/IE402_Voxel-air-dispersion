project:
  name: "IE402 Voxel Air Dispersion"


# ============================================================
# PATHS
# ============================================================

paths:
  buildings: "data/raw/buildings.geojson"

  study_area: "data/raw/study_area.geojson"

  voxel_netcdf: "data/processed/voxel_grid.nc"

  processed_buildings: "data/processed/buildings_with_height.geojson"


# ============================================================
# COORDINATE REFERENCE SYSTEM
# ============================================================

crs:
  # auto_utm:
  # Automatically select the UTM zone from the study area.
  #
  # This is preferred because rasterization and voxel dimensions
  # must be calculated in metres.
  target: "auto_utm"

  # Keep these null if the input files already contain CRS metadata.
  #
  # Only fill them if the original source CRS is KNOWN.
  #
  # Example:
  # buildings_if_missing: "EPSG:4326"
  buildings_if_missing: null

  study_area_if_missing: null


# ============================================================
# DOMAIN
# ============================================================

domain:

  horizontal:

    # Supported modes:
    #
    # fixed_size_centered_on_study_area
    # study_area_bounds
    mode: "fixed_size_centered_on_study_area"


    # --------------------------------------------------------
    # Used by:
    # fixed_size_centered_on_study_area
    # --------------------------------------------------------

    width_m: 500.0

    height_m: 500.0


    # --------------------------------------------------------
    # Used by:
    # study_area_bounds
    #
    # Extra horizontal distance around the study-area polygon
    # before the final domain is snapped to complete grid cells.
    # --------------------------------------------------------

    padding_m: 0.0


  vertical:

    min_m: 0.0

    max_m: 100.0


# ============================================================
# VOXEL GRID
# ============================================================

grid:

  dx_m: 5.0

  dy_m: 5.0

  dz_m: 2.0


# ============================================================
# VOXELIZATION
# ============================================================

voxelization:

  # If true, buildings outside the study-area polygon are removed,
  # even if they are inside the rectangular computational domain.
  clip_to_study_area: true


  # ----------------------------------------------------------
  # BUILDING HEIGHT
  # ----------------------------------------------------------

  height:

    # Checked in this order.
    #
    # The first valid direct-height value is used.
    direct_fields:
      - "height"


    # Used only when no valid direct height is available.
    levels_fields:
      - "building:levels"


    # Conversion used for buildings that only contain a level count:
    #
    # building height =
    # building:levels * meters_per_level
    #
    # This is a modelling assumption and is therefore stored here
    # instead of being hardcoded inside Python.
    meters_per_level: 3.0


    # Heights lower than this value are raised to this minimum.
    minimum_height_m: 0.0


    # null means no artificial upper limit is applied.
    maximum_height_m: null


    fallback:

      # Supported:
      #
      # error
      # fixed
      #
      # "error":
      # Stop if a building has neither a usable direct height nor
      # a usable number of levels.
      #
      # "fixed":
      # Use the configured height_m below.
      #
      # During initial data-quality checks, "error" is safer because
      # missing building heights cannot silently enter the model.
      mode: "error"


      # Used only when:
      #
      # mode: "fixed"
      #
      # Example:
      #
      # mode: "fixed"
      # height_m: 9.0
      height_m: null


  # ----------------------------------------------------------
  # RASTERIZATION
  # ----------------------------------------------------------

  rasterization:

    # false:
    # use normal rasterization behaviour.
    #
    # true:
    # mark every raster cell touched by the building geometry.
    all_touched: false


    # When building polygons overlap, preserve the largest
    # building height in the overlapping raster cell.
    overlap_rule: "maximum_height"


  # ----------------------------------------------------------
  # OUTPUT
  # ----------------------------------------------------------

  output:

    # Save a cleaned copy of the building polygons containing
    # resolved_height_m and height_source for QA/debugging.
    save_processed_buildings: true


    # CRS used only for the exported processed-building layer.
    # EPSG:4326 is convenient for QGIS/web inspection.
    processed_buildings_crs: "EPSG:4326"


    # xarray/netCDF backend.
    netcdf_engine: "netcdf4"


    # netCDF compression level.
    # Valid range: 0-9.
    compression_level: 4


    # Storage types for the main voxel variables.
    height_dtype: "float32"

    mask_dtype: "uint8"


# ============================================================
# RUNTIME
# ============================================================

runtime:

  # Standard Python logging levels:
  #
  # DEBUG
  # INFO
  # WARNING
  # ERROR
  # CRITICAL
  log_level: "INFO"


# ============================================================
# NETCDF METADATA
# ============================================================

metadata:

  title: "3D voxel representation of urban buildings"

  project: "IE402 Voxel Air Dispersion"

  conventions: "CF-1.10"

  coordinate_order: "z,y,x"

  description: "Rasterized building-height field and three-dimensional building occupancy mask"