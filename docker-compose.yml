# Local development stack (docs/spec.md D4, docs/DATABASE.md "Chạy").
#
# Monolith/Python runtime plus PostGIS; startup verifies inputs, migrates and seeds.
# The credentials below are DEV-ONLY defaults (ie402/ie402). Override them with
# environment variables or a repo-root .env file (gitignored) and never reuse
# them outside a local machine.
#
#   docker compose up -d db
#   cd app && npm run db:reset && npm run db:seed

name: ie402-voxel

services:
  app:
    build:
      context: .
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    init: true
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-ie402}:${POSTGRES_PASSWORD:-ie402}@db:5432/${POSTGRES_DB:-ie402}
      SOLVER_MODE: real
      SOLVER_TIMEOUT_S: "900"
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    volumes:
      - artifacts:/opt/project/artifacts
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ie402}
      POSTGRES_USER: ${POSTGRES_USER:-ie402}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ie402}
    ports:
      # Host port defaults to 5433 so it does not clash with a local PostgreSQL.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The image initializes PostGIS on a temporary socket-only server.
      # Require TCP readiness because the app connects from another container.
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Optional web console for inspecting the dev database. Not started by default:
  #   docker compose --profile tools up -d adminer   ->  http://127.0.0.1:8081
  # Log in with System "PostgreSQL", Server "db" and the credentials above.
  adminer:
    image: adminer:4.8.1-standalone
    profiles: [tools]
    restart: "no"
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_HOST_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  artifacts:
  pgdata:
