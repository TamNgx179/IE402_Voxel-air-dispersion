name: Tests

# Fast checks on every change to main and every pull request. The heavier
# Compose rehearsal stays in independent-demo.yml (manual).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API lint, types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    name: Viewer types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api-e2e:
    name: API integration tests with PostGIS
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ie402
          POSTGRES_USER: ie402
          POSTGRES_PASSWORD: ie402
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ie402 -d ie402"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # CI-only credentials of the throwaway service container above.
      DATABASE_URL: postgres://ie402:ie402@localhost:5433/ie402
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Solver runtime used by the real-executor suite
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir -r requirements-solver-lock.txt
      - run: npm ci --prefix app --no-audit --no-fund
      # Fails on an empty suite or any skipped test, so a missing PostGIS cannot look green.
      - run: npm --prefix app run test:e2e:required
      - name: Keep the E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-e2e-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/a7-api-e2e.json
          if-no-files-found: warn
          retention-days: 7

  python:
    name: Solver and analysis tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir -r requirements.txt
      - run: .venv/bin/python -m pytest
