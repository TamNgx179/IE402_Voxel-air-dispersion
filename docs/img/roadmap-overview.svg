<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1000" height="360" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Bản đồ tổng thể 8 tuần</text>

  <!-- Week headers -->
  <g font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">
    <rect x="110" y="42" width="110" height="26" fill="#f0f2f5" stroke="#d0d7de"/><text x="165" y="60">Tuần 1</text>
    <rect x="220" y="42" width="110" height="26" fill="#f0f2f5" stroke="#d0d7de"/><text x="275" y="60">Tuần 2</text>
    <rect x="330" y="42" width="110" height="26" fill="#f0f2f5" stroke="#d0d7de"/><text x="385" y="60">Tuần 3</text>
    <rect x="440" y="42" width="110" height="26" fill="#f0f2f5" stroke="#d0d7de"/><text x="495" y="60">Tuần 4</text>
    <rect x="550" y="42" width="110" height="26" fill="#f0f2f5" stroke="#d0d7de"/><text x="605" y="60">Tuần 5</text>
    <rect x="660" y="42" width="110" height="26" fill="#f0f2f5" stroke="#d0d7de"/><text x="715" y="60">Tuần 6</text>
    <rect x="770" y="42" width="110" height="26" fill="#f0f2f5" stroke="#d0d7de"/><text x="825" y="60">Tuần 7</text>
    <rect x="880" y="42" width="110" height="26" fill="#f0f2f5" stroke="#d0d7de"/><text x="935" y="60">Tuần 8</text>
  </g>

  <!-- Lane A -->
  <rect x="10" y="76" width="100" height="58" rx="5" fill="#dbe8f7" stroke="#4a86c5" stroke-width="1.5"/>
  <text x="60" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2328">NGƯỜI A</text>
  <text x="60" y="117" text-anchor="middle" font-size="10" fill="#4a5560">GIS · Dữ liệu · Web</text>
  <g font-size="10.5" fill="#1f2328" text-anchor="middle">
    <rect x="110" y="76" width="110" height="58" fill="#eef4fb" stroke="#4a86c5"/><text x="165" y="99">Dữ liệu +</text><text x="165" y="115">chọn địa bàn</text>
    <rect x="220" y="76" width="110" height="58" fill="#eef4fb" stroke="#4a86c5"/><text x="275" y="99">Voxel hoá</text><text x="275" y="115">thành phố</text>
    <rect x="330" y="76" width="110" height="58" fill="#eef4fb" stroke="#4a86c5"/><text x="385" y="99">Nguồn</text><text x="385" y="115">phát thải</text>
    <rect x="440" y="76" width="110" height="58" fill="#dbe8f7" stroke="#4a86c5" stroke-width="1.8"/><text x="495" y="99" font-weight="700">Gói</text><text x="495" y="115" font-weight="700">SEMINAR</text>
    <rect x="550" y="76" width="110" height="58" fill="#eef4fb" stroke="#4a86c5"/><text x="605" y="99">Phân tích</text><text x="605" y="115">không gian</text>
    <rect x="660" y="76" width="110" height="58" fill="#eef4fb" stroke="#4a86c5"/><text x="715" y="99">Export dữ liệu</text><text x="715" y="115">+ khung web</text>
    <rect x="770" y="76" width="110" height="58" fill="#fdf3e7" stroke="#d68c2e" stroke-width="1.8"/><text x="825" y="99" font-weight="700">WEB — lõi</text><text x="825" y="115">W1 → W5</text>
    <rect x="880" y="76" width="110" height="58" fill="#fdf3e7" stroke="#d68c2e" stroke-width="1.8"/><text x="935" y="99" font-weight="700">WEB hoàn thiện</text><text x="935" y="115">+ báo cáo</text>
  </g>

  <!-- Lane B -->
  <rect x="10" y="140" width="100" height="58" rx="5" fill="#d7ede2" stroke="#4f9d69" stroke-width="1.5"/>
  <text x="60" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2328">NGƯỜI B</text>
  <text x="60" y="181" text-anchor="middle" font-size="10" fill="#4a5560">Mô hình · Số trị</text>
  <g font-size="10.5" fill="#1f2328" text-anchor="middle">
    <rect x="110" y="140" width="110" height="58" fill="#eef7f1" stroke="#4f9d69"/><text x="165" y="163">Khí tượng</text><text x="165" y="179">+ dựng repo</text>
    <rect x="220" y="140" width="110" height="58" fill="#eef7f1" stroke="#4f9d69"/><text x="275" y="163">Gaussian</text><text x="275" y="179">giải tích</text>
    <rect x="330" y="140" width="110" height="58" fill="#eef7f1" stroke="#4f9d69" stroke-width="1.8"/><text x="385" y="163" font-weight="700">Bộ giải FV</text><text x="385" y="179" font-weight="700">ở 2D</text>
    <rect x="440" y="140" width="110" height="58" fill="#eef7f1" stroke="#4f9d69" stroke-width="1.8"/><text x="495" y="163" font-weight="700">FV lên 3D</text><text x="495" y="179">+ kiểm chứng</text>
    <rect x="550" y="140" width="110" height="58" fill="#eef7f1" stroke="#4f9d69"/><text x="605" y="163">Trường gió</text><text x="605" y="179">SOR Poisson</text>
    <rect x="660" y="140" width="110" height="58" fill="#eef7f1" stroke="#4f9d69"/><text x="715" y="163">Ghép gió +</text><text x="715" y="179">3 kịch bản</text>
    <rect x="770" y="140" width="110" height="58" fill="#eef7f1" stroke="#4f9d69"/><text x="825" y="163">Hỗ trợ web</text><text x="825" y="179">+ dọn code</text>
    <rect x="880" y="140" width="110" height="58" fill="#eef7f1" stroke="#4f9d69"/><text x="935" y="163">Báo cáo</text><text x="935" y="179">mô hình</text>
  </g>

  <!-- Milestones -->
  <text x="60" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#4a5560">MỐC</text>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="275" cy="222" r="13" fill="#fff" stroke="#57606a" stroke-width="1.6"/><text x="275" y="226" fill="#1f2328">M1</text>
    <circle cx="385" cy="222" r="13" fill="#fff" stroke="#57606a" stroke-width="1.6"/><text x="385" y="226" fill="#1f2328">M2</text>
    <circle cx="495" cy="222" r="13" fill="#fff" stroke="#cf222e" stroke-width="2.2"/><text x="495" y="226" fill="#cf222e">M3</text>
    <circle cx="605" cy="222" r="13" fill="#fff" stroke="#57606a" stroke-width="1.6"/><text x="605" y="226" fill="#1f2328">M4</text>
    <circle cx="715" cy="222" r="13" fill="#fff" stroke="#57606a" stroke-width="1.6"/><text x="715" y="226" fill="#1f2328">M5</text>
    <circle cx="825" cy="222" r="13" fill="#fff" stroke="#d68c2e" stroke-width="2.2"/><text x="825" y="226" fill="#9a5f12">M6</text>
    <circle cx="935" cy="222" r="13" fill="#fff" stroke="#d68c2e" stroke-width="2.2"/><text x="935" y="226" fill="#9a5f12">M7</text>
  </g>
  <g font-size="9.5" fill="#6b7480" text-anchor="middle">
    <text x="275" y="250">mảng 3D +</text><text x="275" y="261">Gaussian</text>
    <text x="385" y="250">FV 2D</text><text x="385" y="261">đã verify</text>
    <text x="495" y="250" font-weight="700" fill="#cf222e">FV 3D +</text><text x="495" y="261" font-weight="700" fill="#cf222e">SEMINAR</text>
    <text x="605" y="250">trường gió</text><text x="605" y="261">div ≈ 0</text>
    <text x="715" y="250">3 kịch bản +</text><text x="715" y="261">JSON cho web</text>
    <text x="825" y="250" font-weight="700" fill="#9a5f12">WEB chạy</text><text x="825" y="261" font-weight="700" fill="#9a5f12">được</text>
    <text x="935" y="250" font-weight="700" fill="#9a5f12">SẢN PHẨM</text><text x="935" y="261" font-weight="700" fill="#9a5f12">CUỐI</text>
  </g>

  <!-- Gate -->
  <polygon points="495,276 487,290 503,290" fill="#cf222e"/>
  <rect x="330" y="290" width="330" height="34" rx="6" fill="#fdecee" stroke="#cf222e" stroke-width="1.6"/>
  <text x="495" y="305" text-anchor="middle" font-size="11.5" font-weight="700" fill="#cf222e">CỔNG QUYẾT ĐỊNH — cuối tuần 4</text>
  <text x="495" y="319" text-anchor="middle" font-size="10.5" fill="#8b1a23">FV 3D có đạt sai số &lt; 6% so với nghiệm giải tích không?</text>

  <!-- Phase bands -->
  <rect x="110" y="336" width="440" height="18" rx="4" fill="#eef4fb" stroke="#4a86c5"/>
  <text x="330" y="349" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2a5b8c">GIAI ĐOẠN 1 — tới seminar</text>
  <rect x="550" y="336" width="440" height="18" rx="4" fill="#fdf3e7" stroke="#d68c2e"/>
  <text x="770" y="349" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9a5f12">GIAI ĐOẠN 2 — tới sản phẩm web</text>
</svg>
