<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="705" viewBox="0 0 1160 705" role="img" aria-labelledby="title"><title id="title">3D GIS system architecture</title>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#376580"/></marker></defs>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#162c39}.title{font-size:38px;font-weight:700}.sub{font-size:17px;fill:#476475}.name{font-size:20px;font-weight:700}.desc{font-size:15px}.edge{font-size:13px;font-weight:600;paint-order:stroke;stroke:#f6f9fb;stroke-width:5px;stroke-linejoin:round}</style>
  <rect width="1160" height="705" fill="#f6f9fb"/>
  <text x="52" y="72" class="title">3D GIS system architecture</text><text x="54" y="108" class="sub">React, NestJS modular monolith, Python and PostGIS</text>
  <rect x="367" y="140" width="350" height="520" rx="19" fill="#e9f1f5" stroke="#b6cbd6" stroke-dasharray="6 5"/>
  <text x="392" y="165" class="edge">Application boundary</text>
  <rect x="52" y="180" width="250" height="112" rx="12" fill="#ffffff" stroke="#8faebe"/>
  <text x="70" y="223" class="name">React WebGIS</text><text x="70" y="253" class="desc">Map, analysis and export</text>
  <rect x="392" y="180" width="300" height="112" rx="12" fill="#ffffff" stroke="#8faebe"/>
  <text x="410" y="223" class="name">NestJS REST API</text><text x="410" y="253" class="desc">Controllers, DTOs and services</text>
  <rect x="805" y="180" width="300" height="112" rx="12" fill="#ffffff" stroke="#8faebe"/>
  <text x="823" y="223" class="name">PostgreSQL / PostGIS</text><text x="823" y="253" class="desc">Run state, geometry and voxel arrays</text>
  <rect x="392" y="354" width="300" height="112" rx="12" fill="#ffffff" stroke="#8faebe"/>
  <text x="410" y="397" class="name">Background executor</text><text x="410" y="427" class="desc">Claim, supervise and verify</text>
  <rect x="392" y="528" width="300" height="112" rx="12" fill="#ffffff" stroke="#8faebe"/>
  <text x="410" y="571" class="name">Python solver process</text><text x="410" y="601" class="desc">Diagnostic wind and FV transport</text>
  <rect x="805" y="528" width="300" height="112" rx="12" fill="#ffffff" stroke="#8faebe"/>
  <text x="823" y="571" class="name">Run artifacts</text><text x="823" y="601" class="desc">NetCDF, CSV and checksum manifest</text>
  <rect x="805" y="354" width="300" height="112" rx="12" fill="#ffffff" stroke="#8faebe"/>
  <text x="823" y="397" class="name">Prepared GIS inputs</text><text x="823" y="427" class="desc">Scene seed, weather and road source</text>
  <path d="M302 236H392" fill="none" stroke="#376580" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="347" y="219" text-anchor="middle" class="edge">HTTP</text>
  <path d="M692 236H805" fill="none" stroke="#376580" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="749" y="219" text-anchor="middle" class="edge">SQL</text>
  <path d="M542 292V354" fill="none" stroke="#376580" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="595" y="326" text-anchor="middle" class="edge">Queued run</text>
  <path d="M542 466V528" fill="none" stroke="#376580" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="592" y="499" text-anchor="middle" class="edge">Spawn CLI</text>
  <path d="M692 584H805" fill="none" stroke="#376580" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="749" y="567" text-anchor="middle" class="edge">Write</text>
  <path d="M955 528V490H723V429H692" fill="none" stroke="#376580" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="805" y="485" text-anchor="middle" class="edge">Verify and import</text>
  <path d="M805 385H750V278H692" fill="none" stroke="#376580" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="752" y="365" text-anchor="middle" class="edge">Seed / read</text>
</svg>
