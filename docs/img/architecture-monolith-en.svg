<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="734" viewBox="0 0 1280 734" role="img" aria-labelledby="title description">
  <title id="title">IE402 3D GIS system architecture</title>
  <desc id="description">React calls NestJS over HTTP. NestJS reads and writes PostGIS, runs the Python solver and verifies its files.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10Z" fill="#38617a"/></marker>
  </defs>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#173241}.title{font-weight:700;font-size:38px}.subtitle{font-size:17px;fill:#486375}
    .label{font-size:14px;font-weight:700;fill:#325770}.name{font-size:20px;font-weight:700}.detail{font-size:15px;fill:#365467}
    .card{fill:#fff;stroke:#9db9c8}.arrow{fill:none;stroke:#38617a;stroke-width:2;marker-end:url(#arrow)}
    .edge{font-size:13px;font-weight:600;paint-order:stroke;stroke:#f5f8fa;stroke-width:6px;stroke-linejoin:round}
  </style>
  <rect width="1280" height="734" fill="#f5f8fa"/>
  <text x="40" y="66" class="title">IE402 3D GIS system architecture</text>
  <text x="42" y="101" class="subtitle">Modular monolith with a Python solver process and spatial database</text>
  <rect x="340" y="139" width="592" height="558" rx="18" fill="#eaf2f6" stroke="#a5bfce" stroke-dasharray="6 5"/>
  <text x="360" y="168" class="label">APPLICATION CONTAINER</text>

  <rect x="40" y="193" width="240" height="120" rx="12" class="card"/>
  <text x="56" y="222" class="name">React WebGIS</text>
  <text x="56" y="249" class="detail">MapLibre and deck.gl</text>
  <text x="56" y="272" class="detail">Viewer facade and view state</text>
  <text x="56" y="295" class="detail">Simulation, analysis and export</text>

  <rect x="365" y="193" width="270" height="120" rx="12" class="card"/>
  <text x="382" y="222" class="name">NestJS API</text>
  <text x="382" y="249" class="detail">Controllers, DTOs and schemas</text>
  <text x="382" y="272" class="detail">Run and spatial analysis services</text>
  <text x="382" y="295" class="detail">Serves the React build</text>

  <rect x="695" y="193" width="217" height="120" rx="12" class="card"/>
  <text x="712" y="222" class="name">Feature models</text>
  <text x="712" y="249" class="detail">Parameterized spatial SQL</text>
  <text x="712" y="272" class="detail">Claim and import transactions</text>

  <rect x="990" y="193" width="250" height="120" rx="12" fill="#e6f0e9" stroke="#a5beb0"/>
  <text x="1007" y="222" class="name">PostgreSQL and PostGIS</text>
  <text x="1007" y="249" class="detail">Scene geometry and indexes</text>
  <text x="1007" y="272" class="detail">Run states and voxel arrays</text>

  <rect x="365" y="385" width="270" height="109" rx="12" class="card"/>
  <text x="382" y="414" class="name">Simulation executor</text>
  <text x="382" y="441" class="detail">Claim, supervise and verify</text>
  <text x="382" y="464" class="detail">Python CLI adapter</text>

  <rect x="40" y="558" width="240" height="108" rx="12" class="card"/>
  <text x="56" y="587" class="name">Prepared inputs</text>
  <text x="56" y="614" class="detail">Terrain-relative scene and grid</text>
  <text x="56" y="637" class="detail">Seasonal wind and road emissions</text>

  <rect x="365" y="558" width="270" height="108" rx="12" class="card"/>
  <text x="382" y="587" class="name">Python solver process</text>
  <text x="382" y="614" class="detail">Diagnostic wind projection</text>
  <text x="382" y="637" class="detail">Finite-volume PM2.5 transport</text>

  <rect x="990" y="558" width="250" height="108" rx="12" fill="#fbf1e3" stroke="#d5bc99"/>
  <text x="1007" y="587" class="name">Run artifact volume</text>
  <text x="1007" y="614" class="detail">Verified NetCDF and CSV</text>
  <text x="1007" y="637" class="detail">Manifest, config and solver logs</text>

  <path class="arrow" d="M280 252H365"/>
  <text x="322" y="239" class="edge" text-anchor="middle">HTTP</text>
  <path class="arrow" d="M635 252H695"/>
  <path class="arrow" d="M912 252H990"/>
  <text x="951" y="239" class="edge" text-anchor="middle">SQL</text>
  <path class="arrow" d="M635 415H801V313"/>
  <text x="711" y="401" class="edge" text-anchor="middle">Claim and publish</text>
  <path class="arrow" d="M480 494V558"/>
  <text x="467" y="531" class="edge" text-anchor="end">Spawn CLI</text>
  <path class="arrow" d="M520 558V494"/>
  <text x="533" y="531" class="edge">Progress and exit</text>
  <path class="arrow" d="M280 612H365"/>
  <text x="322" y="599" class="edge" text-anchor="middle">Read</text>
  <path class="arrow" d="M635 612H990"/>
  <text x="812" y="599" class="edge" text-anchor="middle">Write fields and manifest</text>
  <path class="arrow" d="M1120 558V464H635"/>
  <text x="970" y="451" class="edge" text-anchor="middle">Read and verify</text>
</svg>
