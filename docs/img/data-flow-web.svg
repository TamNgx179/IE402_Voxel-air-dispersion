<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 215" width="1000" height="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1000" height="215" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Luồng dữ liệu ra web</text>

  <!-- Box 1 -->
  <rect x="30" y="58" width="200" height="112" rx="8" fill="#eef4fb" stroke="#4a86c5" stroke-width="1.6"/>
  <text x="130" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">C[k,j,i]</text>
  <text x="130" y="108" text-anchor="middle" font-size="12" fill="#4a5560">netCDF-4 (chuẩn CF)</text>
  <text x="130" y="130" text-anchor="middle" font-size="12" fill="#4a5560">500.000 voxel</text>
  <text x="130" y="152" text-anchor="middle" font-size="12" fill="#4a5560">2 MB / trường</text>

  <!-- Arrow 1 -->
  <line x1="234" y1="114" x2="268" y2="114" stroke="#8b949e" stroke-width="2"/>
  <polygon points="276,114 266,109 266,119" fill="#8b949e"/>

  <!-- Box 2 -->
  <rect x="280" y="58" width="200" height="112" rx="8" fill="#f3f0fa" stroke="#8b72c9" stroke-width="1.6"/>
  <text x="380" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">06_export_web.py</text>
  <text x="380" y="108" text-anchor="middle" font-size="12" fill="#4a5560">gộp theo tầng z</text>
  <text x="380" y="130" text-anchor="middle" font-size="12" fill="#4a5560">lọc ô nồng độ thấp</text>
  <text x="380" y="152" text-anchor="middle" font-size="12" fill="#4a5560">netCDF → JSON</text>

  <!-- Arrow 2 -->
  <line x1="484" y1="114" x2="518" y2="114" stroke="#8b949e" stroke-width="2"/>
  <polygon points="526,114 516,109 516,119" fill="#8b949e"/>

  <!-- Box 3 -->
  <rect x="530" y="58" width="200" height="112" rx="8" fill="#eef7f1" stroke="#4f9d69" stroke-width="1.6"/>
  <text x="630" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">web/data/*.json</text>
  <text x="630" y="108" text-anchor="middle" font-size="12" fill="#4a5560">50 tầng × 10.000 ô</text>
  <text x="630" y="130" text-anchor="middle" font-size="12" fill="#4a5560">+ buildings.geojson</text>
  <text x="630" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#2f6f46">mục tiêu &lt; 5 MB</text>

  <!-- Arrow 3 -->
  <line x1="734" y1="114" x2="768" y2="114" stroke="#8b949e" stroke-width="2"/>
  <polygon points="776,114 766,109 766,119" fill="#8b949e"/>

  <!-- Box 4 -->
  <rect x="780" y="58" width="190" height="112" rx="8" fill="#fdf3e7" stroke="#d68c2e" stroke-width="1.6"/>
  <text x="875" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">deck.gl + MapLibre</text>
  <text x="875" y="108" text-anchor="middle" font-size="12" fill="#4a5560">GridCellLayer</text>
  <text x="875" y="130" text-anchor="middle" font-size="12" fill="#4a5560">PolygonLayer (nhà)</text>
  <text x="875" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#9a5f12">thanh trượt đổi tầng z</text>

  <!-- Footer -->
  <text x="500" y="199" text-anchor="middle" font-size="11.5" fill="#6b7480">Một file HTML · thư viện load qua CDN · không có bước build (không npm, không webpack)</text>
</svg>
