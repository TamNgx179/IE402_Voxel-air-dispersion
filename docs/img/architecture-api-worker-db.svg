<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <style>
    .box{fill:#eef6ff;stroke:#245b86;stroke-width:2;rx:14}
    .db{fill:#fff4df;stroke:#9a6413;stroke-width:2;rx:14}
    .worker{fill:#e9f7ee;stroke:#2d7546;stroke-width:2;rx:14}
    .artifact{fill:#f4efff;stroke:#6e42a1;stroke-width:2;rx:14}
    .title{font:700 22px Arial;fill:#15324b}.text{font:16px Arial;fill:#243746}
    .small{font:14px Arial;fill:#3d5363}.arrow{stroke:#405d73;stroke-width:2.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#405d73"/></marker></defs>
  <rect x="20" y="20" width="1160" height="610" fill="#fff" stroke="#7b3fe4" stroke-width="3" rx="18"/>
  <text x="50" y="58" class="title">Voxel Air Dispersion — API · Worker · Database</text>
  <rect x="65" y="130" width="220" height="160" class="box"/>
  <text x="90" y="170" class="title">Web 3D / Client</text><text x="90" y="205" class="text">Chọn study area</text><text x="90" y="230" class="text">Slider cao độ z</text><text x="90" y="255" class="text">Bản đồ · profile · metrics</text>
  <rect x="350" y="100" width="300" height="230" class="box"/>
  <text x="380" y="140" class="title">NestJS API</text><text x="380" y="178" class="text">DTO / validation</text><text x="380" y="204" class="text">Runs &amp; status</text><text x="380" y="230" class="text">Spatial query endpoints</text><text x="380" y="256" class="text">Job enqueue / retry</text><text x="380" y="282" class="small">Không chạy solver trong request</text>
  <rect x="350" y="390" width="300" height="170" class="worker"/>
  <text x="380" y="430" class="title">Python Simulation Worker</text><text x="380" y="468" class="text">Voxel → emission → corrected face wind</text><text x="380" y="494" class="text">FV transport → QG verification gate</text><text x="380" y="520" class="text">NetCDF + metrics + evidence manifest</text>
  <rect x="760" y="100" width="330" height="230" class="db"/>
  <text x="790" y="140" class="title">PostgreSQL + PostGIS</text><text x="790" y="180" class="text">study areas · buildings · roads</text><text x="790" y="206" class="text">scenarios · simulation_runs</text><text x="790" y="232" class="text">slices · summaries · metrics</text><text x="790" y="270" class="small">GiST + B-tree indexes</text>
  <rect x="760" y="390" width="330" height="170" class="artifact"/>
  <text x="790" y="430" class="title">Artifact storage</text><text x="790" y="468" class="text">NetCDF đầy đủ</text><text x="790" y="494" class="text">JSON/Parquet payload nhẹ</text><text x="790" y="520" class="text">logs · manifest · provenance</text>
  <path d="M285 210 L350 210" class="arrow"/><text x="295" y="195" class="small">HTTP/JSON</text>
  <path d="M650 175 L760 175" class="arrow"/><text x="665" y="160" class="small">SQL / PostGIS</text>
  <path d="M500 330 L500 390" class="arrow"/><text x="515" y="365" class="small">enqueue run_id</text>
  <path d="M650 475 L760 475" class="arrow"/><text x="665" y="460" class="small">artifacts + metrics</text>
  <path d="M760 270 L650 270" class="arrow"/><text x="660" y="255" class="small">status / query</text>
  <path d="M760 540 L650 540" class="arrow"/><text x="665" y="525" class="small">artifact URL</text>
</svg>
