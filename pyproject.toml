# Runtime dependencies stay in requirements.txt; they are not duplicated here.
# No [build-system]: this is run as scripts and notebooks, not installed, and
# modules named 01_voxelize.py cannot be imported as a package anyway.

[project]
name = "ie402-voxel-air-dispersion"
version = "0.1.0"
description = "Urban air-pollution dispersion on a 3D GIS voxel grid"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
