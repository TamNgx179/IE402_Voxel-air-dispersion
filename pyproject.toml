# Project metadata and tool configuration.
#
# Runtime dependencies stay in requirements.txt, which is what the team installs
# from. They are NOT duplicated here: two lists drift, and the one people run is
# the one that stays right.
#
# There is deliberately no [build-system] section. This repository is run as
# scripts and notebooks, not installed as a package, and several modules under
# src/ are named 01_voxelize.py, 02_wind.py and so on - names that are valid
# files but not valid Python identifiers, so they cannot be imported as a
# package anyway. Declaring a build backend would claim something untrue.

[project]
name = "ie402-voxel-air-dispersion"
version = "0.1.0"
description = "Urban air-pollution dispersion on a 3D GIS voxel grid"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
